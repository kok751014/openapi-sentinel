# GitHub Actions example — OpenAPI Sentinel
#
# Compares the contract on main against the PR head and fails on high+ findings.
# Requires the composite action in this repository (action/action.yml).

name: API compatibility

on:
  pull_request:

jobs:
  sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history so the git: source can resolve origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Typical flow: generate the current swagger.json first.
      # - run: dotnet run --project src/My.Api -- generate-swagger > swagger.json

      - name: Compare contracts
        id: sentinel
        uses: ./action
        with:
          base: git:origin/main:contracts/openapi.yaml
          head: contracts/openapi.yaml
          fail-on: high
          report-dir: sentinel-reports

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-report
          path: sentinel-reports/

      # The action already appends the compact PR summary to $GITHUB_STEP_SUMMARY.
