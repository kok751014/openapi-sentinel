          value: 1
          type: path
        - name: verbose
          value: not-a-boolean
    - name: 邊界值－id 使用最小允許值
      description: 此範例將 `id` 設定為規格允許的最小邊界值，用於驗證邊界輸入可被後端正確處理。
      request:
        url: https://api.example.com/v1/users/:id
