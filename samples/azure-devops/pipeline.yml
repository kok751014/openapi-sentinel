# Azure DevOps pipeline — OpenAPI Sentinel
#
# Installs the .NET global tool and compares base vs current contract.
# Adjust the tool source to your feed or use a checked-in build.

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: "10.0.x"

steps:
  # Full history so the git: source can resolve origin/main.
  - checkout: self
    fetchDepth: 0

  - task: UseDotNet@2
    inputs:
      version: $(dotnetVersion)

  - script: dotnet tool install --global OpenApiSentinel || true
    displayName: Install OpenAPI Sentinel
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

  - script: |
      echo "##vso[task.setvariable variable=PATH]$(echo $HOME/.dotnet/tools):$PATH"
    displayName: Add tools to PATH

  - script: |
      set +e
      openapi-sentinel compare \
        git:origin/main:contracts/openapi.yaml \
        contracts/openapi.yaml \
        --fail-on high \
        --json $(Build.ArtifactStagingDirectory)/sentinel/api-diff.json \
        --markdown $(Build.ArtifactStagingDirectory)/sentinel/api-diff.md \
        --html $(Build.ArtifactStagingDirectory)/sentinel/api-diff.html \
        --no-color
      code=$?
      breaking=$(python3 -c "import json;d=json.load(open('$(Build.ArtifactStagingDirectory)/sentinel/api-diff.json'));print(d['summary']['breaking'])")
      echo "##vso[task.setvariable variable=sentinelBreaking;isOutput=true]$breaking"
      exit $code
    displayName: Compare API contracts
    name: sentinel
    env:
      SENTINEL_SWAGGER_TOKEN: $(SwaggerToken)   # headerEnv: Authorization resolved from env

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)/sentinel
      artifactName: sentinel-reports
