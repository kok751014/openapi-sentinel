name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  samples:
    name: Demo scenarios on sample contracts
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CLI
        run: dotnet build -c Release src/OpenApiSentinel.Cli

      - name: Safe evolution passes
        run: |
          dotnet run -c Release --no-build --project src/OpenApiSentinel.Cli -- \
            compare samples/basic/v1.yaml samples/basic/v2-safe.yaml \
            --fail-on high --no-color

      - name: Breaking evolution fails with MAJOR recommendation
        run: |
          set +e
          dotnet run -c Release --no-build --project src/OpenApiSentinel.Cli -- \
            compare samples/basic/v1.yaml samples/basic/v2-breaking.yaml \
            --fail-on high --json artifacts/api-diff.json --html artifacts/api-diff.html \
            --no-color
          code=$?
          [ "$code" -eq 1 ] || { echo "expected policy violation (exit 1), got $code"; exit 1; }
          grep -q '"display": "MAJOR"' artifacts/api-diff.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sentinel-reports
          path: artifacts/

  pack:
    name: Package global tool
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack NuGet tool
        run: dotnet pack -c Release -o artifacts/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-tool
          path: artifacts/pkg/

  # Tag-triggered publication: pushing v* runs the full release script, creates a
  # GitHub Release with all artifacts + SHA256SUMS, and pushes the nupkg to NuGet.org.
  # Requires two repository secrets: NUGET_API_KEY (nuget.org) — Docker publishing is
  # handled separately when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-test, samples]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release artifacts
        run: ./build/release.sh "${GITHUB_REF_NAME#v}"

      - name: Verify checksums
        run: cd "dist/${GITHUB_REF_NAME#v}" && sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: |
          NOTES="dist/$VER/RELEASE_NOTES.md"
          gh release create "$VER" --title "$VER" --notes-file "$NOTES" \
            dist/$VER/openapi-sentinel-*.zip \
            dist/$VER/openapi-sentinel-*.tar.gz \
            dist/$VER/SHA256SUMS

      - name: Push NuGet global tool
        run: dotnet nuget push "dist/*/pkg/OpenApiSentinel.*.nupkg" \
               --source https://api.nuget.org/v3/index.json \
               --api-key "${{ secrets.NUGET_API_KEY }}" \
               --skip-duplicate

  docker:
    name: Build & push Docker image
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (always validates the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME && format('{0}/openapi-sentinel:{1}', vars.DOCKERHUB_USERNAME, github.ref_name) || '' }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/openapi-sentinel:latest', vars.DOCKERHUB_USERNAME) || '' }}
