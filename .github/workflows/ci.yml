name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to publish (for example v1.0.0). Leave empty to run CI only.'
        required: false
        type: string

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  samples:
    name: Demo scenarios on sample contracts
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build CLI
        run: dotnet build -c Release src/OpenApiSentinel.Cli

      - name: Safe evolution passes
        run: |
          dotnet run -c Release --no-build --project src/OpenApiSentinel.Cli -- \
            compare samples/basic/v1.yaml samples/basic/v2-safe.yaml \
            --fail-on high --no-color

      - name: Breaking evolution fails with MAJOR recommendation
        run: |
          set +e
          dotnet run -c Release --no-build --project src/OpenApiSentinel.Cli -- \
            compare samples/basic/v1.yaml samples/basic/v2-breaking.yaml \
            --fail-on high --json artifacts/api-diff.json --html artifacts/api-diff.html \
            --no-color
          code=$?
          [ "$code" -eq 1 ] || { echo "expected policy violation (exit 1), got $code"; exit 1; }
          grep -q '"display": "MAJOR"' artifacts/api-diff.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-reports
          path: artifacts/

  pack:
    name: Package global tool
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack NuGet tool
        run: dotnet pack -c Release -o artifacts/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-tool
          path: artifacts/pkg/

  # Tag-triggered publication:
  # - pushing v* publishes a GitHub Release after build/test/sample verification
  # - workflow_dispatch with release_tag can publish an already-existing tag
  # - NuGet publication is skipped when NUGET_API_KEY is not configured
  # - Docker is always built to validate the Dockerfile, but is pushed only when
  #   both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are configured
  release:
    name: Publish release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    needs: [build-test, samples]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./build/release.sh "$VERSION"

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd "dist/$VERSION"
          sha256sum -c SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          NOTES="dist/$VERSION/RELEASE_NOTES.md"

          assets=(
            dist/$VERSION/openapi-sentinel-*.zip
            dist/$VERSION/openapi-sentinel-*.tar.gz
            dist/$VERSION/SHA256SUMS
          )

          if compgen -G "dist/$VERSION/pkg/OpenApiSentinel.*.nupkg" > /dev/null; then
            assets+=(dist/$VERSION/pkg/OpenApiSentinel.*.nupkg)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets."
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES" \
              "${assets[@]}"
          fi

      - name: Push NuGet global tool when configured
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not configured; skipping NuGet.org publication."
            exit 0
          fi

          VERSION="${RELEASE_TAG#v}"
          dotnet nuget push "dist/$VERSION/pkg/OpenApiSentinel.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  docker:
    name: Build & push Docker image
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Detect Docker Hub publishing credentials
        id: docker-meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=$DOCKERHUB_USERNAME/openapi-sentinel:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$DOCKERHUB_USERNAME/openapi-sentinel:latest" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "version_tag=openapi-sentinel:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are incomplete; image will be built but not pushed."
          fi

      - name: Login to Docker Hub
        if: ${{ steps.docker-meta.outputs.can_push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push only when configured
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.docker-meta.outputs.can_push == 'true' }}
          tags: |
            ${{ steps.docker-meta.outputs.version_tag }}
            ${{ steps.docker-meta.outputs.latest_tag }}
